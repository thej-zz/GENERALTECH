<!DOCTYPE html>
<html>
<head>
<title>Roofing | General Tech</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../gallery.css">
</head>
<body>
    <header class="work-header">
  <a href="../home.html" class="work-logo">General<span>Tech</span></a>
</header>

<div class="work-page">
  <h1 class="work-title">Roofing Works</h1>
  <p class="work-subtitle">Our completed roofing projects, built with precision and durability.</p>
<div class="gallery" data-category="roofing" aria-live="polite"></div>
</div>

<button class="book-btn" onclick="openForm('Roofing')">Enquire About</button>

<div class="form-overlay" id="formOverlay">
  <div class="form-popup">
    <span class="form-close" onclick="closeForm()">&times;</span>

    <h2>Enquire More Detailed</h2>
    <p class="form-subtitle">Our team will contact you shortly</p>

    <form onsubmit="sendToWhatsApp(event)">
      <input id="name" placeholder="Full Name" required>
      <input id="phone" placeholder="Phone Number" required>
      <textarea id="address" placeholder="Service Address" required></textarea>
      <textarea id="details" placeholder="Describe Your Requirement"></textarea>
      <input id="category" readonly>
      <button type="submit" class="submit-btn">Send Message</button>
    </form>
  </div>
</div>


<script src="../gallery.js"></script>
<div class="lightbox" id="lightbox">
  <span class="close">&times;</span>
  <span class="nav prev">&#10094;</span>

  <img id="lightbox-img">

  <span class="nav next">&#10095;</span>

  <div class="desc" id="lightbox-desc"></div>
</div>

</body>
</html>
